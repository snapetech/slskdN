services:
  slskdn:
    image: docker.io/snapetech/slskdn:2026092517-slskdn.325
    container_name: slskdn
    restart: unless-stopped
    environment:
      SLSKD_HTTP_ADDRESS: 0.0.0.0
      SLSKD_HTTP_PORT: "5030"
      SLSKD_HTTPS_PORT: "5031"
      SLSKD_SLSK_LISTEN_PORT: "50300"
      SLSKD_APP_DIR: /app
      SLSKD_DOWNLOADS_DIR: /downloads
      SLSKD_SHARED_DIR: /music
      SLSKD_UMASK: "0022"
    ports:
      - "5030:5030/tcp"
      - "50300:50300/tcp"
      - "50300:50300/udp"
    volumes:
      - slskdn-app:/app
      - slskdn-downloads:/downloads
      - slskdn-music:/music:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:5030/health"]
      interval: 60s
      timeout: 3s
      start_period: 60m
      retries: 3

volumes:
  slskdn-app:
  slskdn-downloads:
  slskdn-music:
