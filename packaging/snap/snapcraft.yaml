name: slskdn
base: core22
version: '2026100514-slskdn.342'
summary: slskdN, an unofficial batteries-included fork of slskd
description: |
  slskdN is an unofficial fork of slskd with batteries-included Soulseek features:
  SongID, Discovery Graph, multi-source downloads, DHT mesh networking,
  auto-replace, wishlist, and security hardening.
grade: stable
confinement: strict
architectures:
  - amd64

apps:
  slskdn:
    command: slskd
    daemon: simple
    plugs: [network, network-bind, home, removable-media]
    environment:
      DOTNET_BUNDLE_EXTRACT_BASE_DIR: $SNAP_USER_COMMON/.net

parts:
  slskdn:
    plugin: dump
    source: https://github.com/snapetech/slskdn/releases/download/2026100514-slskdn.342/slskdn-main-linux-glibc-x64.zip
    source-checksum: sha256/10da268521b8c680d50e5ab0f7f7fa48fe0712e54770dda8cf8df5893b94c6ff
    stage-packages:
      - libicu70
      - libssl3
