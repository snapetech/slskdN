name: slskdn
base: core22
version: '2026051318-slskdn.250'
summary: slskdN, an unofficial batteries-included fork of slskd
description: |
  slskdN is an unofficial fork of slskd with batteries-included Soulseek features:
  SongID, Discovery Graph, multi-source downloads, DHT mesh networking,
  auto-replace, wishlist, and security hardening.
grade: stable
confinement: strict
architectures:
  - amd64

apps:
  slskdn:
    command: slskd
    daemon: simple
    plugs: [network, network-bind, home, removable-media]
    environment:
      DOTNET_BUNDLE_EXTRACT_BASE_DIR: $SNAP_USER_COMMON/.net

parts:
  slskdn:
    plugin: dump
    source: https://github.com/snapetech/slskdn/releases/download/2026051318-slskdn.250/slskdn-main-linux-glibc-x64.zip
    source-checksum: sha256/ed2d793d0606dea4ebd003089b62f762399b4b3b590a4c16853be2840bbe5bf7
    stage-packages:
      - libicu70
      - libssl3
