name: slskdn
base: core22
version: '2026051221-slskdn.247'
summary: slskdN, an unofficial batteries-included fork of slskd
description: |
  slskdN is an unofficial fork of slskd with batteries-included Soulseek features:
  SongID, Discovery Graph, multi-source downloads, DHT mesh networking,
  auto-replace, wishlist, and security hardening.
grade: stable
confinement: strict
architectures:
  - amd64

apps:
  slskdn:
    command: slskd
    daemon: simple
    plugs: [network, network-bind, home, removable-media]
    environment:
      DOTNET_BUNDLE_EXTRACT_BASE_DIR: $SNAP_USER_COMMON/.net

parts:
  slskdn:
    plugin: dump
    source: https://github.com/snapetech/slskdn/releases/download/2026051221-slskdn.247/slskdn-main-linux-glibc-x64.zip
    source-checksum: sha256/fb4480b02ca17dd4f6bacc9728c16cf3700b6a317a6b174138d5e8c72255cb5d
    stage-packages:
      - libicu70
      - libssl3
