name: slskdn
base: core22
version: '2026072417-slskdn.289'
summary: slskdN, an unofficial batteries-included fork of slskd
description: |
  slskdN is an unofficial fork of slskd with batteries-included Soulseek features:
  SongID, Discovery Graph, multi-source downloads, DHT mesh networking,
  auto-replace, wishlist, and security hardening.
grade: stable
confinement: strict
architectures:
  - amd64

apps:
  slskdn:
    command: slskd
    daemon: simple
    plugs: [network, network-bind, home, removable-media]
    environment:
      DOTNET_BUNDLE_EXTRACT_BASE_DIR: $SNAP_USER_COMMON/.net

parts:
  slskdn:
    plugin: dump
    source: https://github.com/snapetech/slskdn/releases/download/2026072417-slskdn.289/slskdn-main-linux-glibc-x64.zip
    source-checksum: sha256/04895cfbe24b2c196f2de9ede83106e11f25bc0054d85d3dd848f19b9626f59a
    stage-packages:
      - libicu70
      - libssl3
