name: slskdn
base: core22
version: '2026051600-slskdn.258'
summary: slskdN, an unofficial batteries-included fork of slskd
description: |
  slskdN is an unofficial fork of slskd with batteries-included Soulseek features:
  SongID, Discovery Graph, multi-source downloads, DHT mesh networking,
  auto-replace, wishlist, and security hardening.
grade: stable
confinement: strict
architectures:
  - amd64

apps:
  slskdn:
    command: slskd
    daemon: simple
    plugs: [network, network-bind, home, removable-media]
    environment:
      DOTNET_BUNDLE_EXTRACT_BASE_DIR: $SNAP_USER_COMMON/.net

parts:
  slskdn:
    plugin: dump
    source: https://github.com/snapetech/slskdn/releases/download/2026051600-slskdn.258/slskdn-main-linux-glibc-x64.zip
    source-checksum: sha256/2c7d2688f6da7939a98d9936cd3d2bbe012199a311e2646bbc83a3b454597da8
    stage-packages:
      - libicu70
      - libssl3
