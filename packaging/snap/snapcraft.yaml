name: slskdn
base: core22
version: '2026100505-slskdn.340'
summary: slskdN, an unofficial batteries-included fork of slskd
description: |
  slskdN is an unofficial fork of slskd with batteries-included Soulseek features:
  SongID, Discovery Graph, multi-source downloads, DHT mesh networking,
  auto-replace, wishlist, and security hardening.
grade: stable
confinement: strict
architectures:
  - amd64

apps:
  slskdn:
    command: slskd
    daemon: simple
    plugs: [network, network-bind, home, removable-media]
    environment:
      DOTNET_BUNDLE_EXTRACT_BASE_DIR: $SNAP_USER_COMMON/.net

parts:
  slskdn:
    plugin: dump
    source: https://github.com/snapetech/slskdn/releases/download/2026100505-slskdn.340/slskdn-main-linux-glibc-x64.zip
    source-checksum: sha256/855d49abeb66a8e75ff0344587fea221cd409c06d36fbe250023b6d3da2c681b
    stage-packages:
      - libicu70
      - libssl3
