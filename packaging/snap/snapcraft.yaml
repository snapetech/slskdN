name: slskdn
base: core22
version: '2026051600-slskdn.259'
summary: slskdN, an unofficial batteries-included fork of slskd
description: |
  slskdN is an unofficial fork of slskd with batteries-included Soulseek features:
  SongID, Discovery Graph, multi-source downloads, DHT mesh networking,
  auto-replace, wishlist, and security hardening.
grade: stable
confinement: strict
architectures:
  - amd64

apps:
  slskdn:
    command: slskd
    daemon: simple
    plugs: [network, network-bind, home, removable-media]
    environment:
      DOTNET_BUNDLE_EXTRACT_BASE_DIR: $SNAP_USER_COMMON/.net

parts:
  slskdn:
    plugin: dump
    source: https://github.com/snapetech/slskdn/releases/download/2026051600-slskdn.259/slskdn-main-linux-glibc-x64.zip
    source-checksum: sha256/1c658abfef1027eeb742ae0ad5c3f8eabacf226e440891a628f352a380bb61de
    stage-packages:
      - libicu70
      - libssl3
