name: slskdn
base: core22
version: '2026052503-slskdn.269'
summary: slskdN, an unofficial batteries-included fork of slskd
description: |
  slskdN is an unofficial fork of slskd with batteries-included Soulseek features:
  SongID, Discovery Graph, multi-source downloads, DHT mesh networking,
  auto-replace, wishlist, and security hardening.
grade: stable
confinement: strict
architectures:
  - amd64

apps:
  slskdn:
    command: slskd
    daemon: simple
    plugs: [network, network-bind, home, removable-media]
    environment:
      DOTNET_BUNDLE_EXTRACT_BASE_DIR: $SNAP_USER_COMMON/.net

parts:
  slskdn:
    plugin: dump
    source: https://github.com/snapetech/slskdn/releases/download/2026052503-slskdn.269/slskdn-main-linux-glibc-x64.zip
    source-checksum: sha256/4d237b35f8e66df9ea39bfdb857a959780f4f96c4848c16e0b05a85803413bbd
    stage-packages:
      - libicu70
      - libssl3
