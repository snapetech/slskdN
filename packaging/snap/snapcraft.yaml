name: slskdn
base: core22
version: '2026051416-slskdn.252'
summary: slskdN, an unofficial batteries-included fork of slskd
description: |
  slskdN is an unofficial fork of slskd with batteries-included Soulseek features:
  SongID, Discovery Graph, multi-source downloads, DHT mesh networking,
  auto-replace, wishlist, and security hardening.
grade: stable
confinement: strict
architectures:
  - amd64

apps:
  slskdn:
    command: slskd
    daemon: simple
    plugs: [network, network-bind, home, removable-media]
    environment:
      DOTNET_BUNDLE_EXTRACT_BASE_DIR: $SNAP_USER_COMMON/.net

parts:
  slskdn:
    plugin: dump
    source: https://github.com/snapetech/slskdn/releases/download/2026051416-slskdn.252/slskdn-main-linux-glibc-x64.zip
    source-checksum: sha256/f37d9d1a91eca5f69c6eaafb1d9ef9e6e035190d1bf1aa1221aafb4dc549c80e
    stage-packages:
      - libicu70
      - libssl3
