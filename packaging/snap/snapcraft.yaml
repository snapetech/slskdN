name: slskdn
base: core22
version: '2026082115-slskdn.316'
summary: slskdN, an unofficial batteries-included fork of slskd
description: |
  slskdN is an unofficial fork of slskd with batteries-included Soulseek features:
  SongID, Discovery Graph, multi-source downloads, DHT mesh networking,
  auto-replace, wishlist, and security hardening.
grade: stable
confinement: strict
architectures:
  - amd64

apps:
  slskdn:
    command: slskd
    daemon: simple
    plugs: [network, network-bind, home, removable-media]
    environment:
      DOTNET_BUNDLE_EXTRACT_BASE_DIR: $SNAP_USER_COMMON/.net

parts:
  slskdn:
    plugin: dump
    source: https://github.com/snapetech/slskdn/releases/download/2026082115-slskdn.316/slskdn-main-linux-glibc-x64.zip
    source-checksum: sha256/0a1b05ad7eaef84b1fa3c1f2aa78786e1a8e3daab3d3bae051e1a7b701656cd3
    stage-packages:
      - libicu70
      - libssl3
