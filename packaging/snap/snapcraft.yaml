name: slskdn
base: core22
version: '2026080415-slskdn.299'
summary: slskdN, an unofficial batteries-included fork of slskd
description: |
  slskdN is an unofficial fork of slskd with batteries-included Soulseek features:
  SongID, Discovery Graph, multi-source downloads, DHT mesh networking,
  auto-replace, wishlist, and security hardening.
grade: stable
confinement: strict
architectures:
  - amd64

apps:
  slskdn:
    command: slskd
    daemon: simple
    plugs: [network, network-bind, home, removable-media]
    environment:
      DOTNET_BUNDLE_EXTRACT_BASE_DIR: $SNAP_USER_COMMON/.net

parts:
  slskdn:
    plugin: dump
    source: https://github.com/snapetech/slskdn/releases/download/2026080415-slskdn.299/slskdn-main-linux-glibc-x64.zip
    source-checksum: sha256/fc5c55021e5d5f57dda256dfe982298a428a771ca4bc1ae20710f64f8b9f3e64
    stage-packages:
      - libicu70
      - libssl3
