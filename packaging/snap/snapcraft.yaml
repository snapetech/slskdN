name: slskdn
base: core22
version: '2026092418-slskdn.322'
summary: slskdN, an unofficial batteries-included fork of slskd
description: |
  slskdN is an unofficial fork of slskd with batteries-included Soulseek features:
  SongID, Discovery Graph, multi-source downloads, DHT mesh networking,
  auto-replace, wishlist, and security hardening.
grade: stable
confinement: strict
architectures:
  - amd64

apps:
  slskdn:
    command: slskd
    daemon: simple
    plugs: [network, network-bind, home, removable-media]
    environment:
      DOTNET_BUNDLE_EXTRACT_BASE_DIR: $SNAP_USER_COMMON/.net

parts:
  slskdn:
    plugin: dump
    source: https://github.com/snapetech/slskdn/releases/download/2026092418-slskdn.322/slskdn-main-linux-glibc-x64.zip
    source-checksum: sha256/bdd2c22dd69ac0793933b88532832ed8101951e3461a3adcf49be8e75c9e4d98
    stage-packages:
      - libicu70
      - libssl3
