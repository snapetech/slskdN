name: slskdn
base: core22
version: '2026071502-slskdn.277'
summary: slskdN, an unofficial batteries-included fork of slskd
description: |
  slskdN is an unofficial fork of slskd with batteries-included Soulseek features:
  SongID, Discovery Graph, multi-source downloads, DHT mesh networking,
  auto-replace, wishlist, and security hardening.
grade: stable
confinement: strict
architectures:
  - amd64

apps:
  slskdn:
    command: slskd
    daemon: simple
    plugs: [network, network-bind, home, removable-media]
    environment:
      DOTNET_BUNDLE_EXTRACT_BASE_DIR: $SNAP_USER_COMMON/.net

parts:
  slskdn:
    plugin: dump
    source: https://github.com/snapetech/slskdn/releases/download/2026071502-slskdn.277/slskdn-main-linux-glibc-x64.zip
    source-checksum: sha256/35646c75bcd431e5cabf664c2f08e5adfa5815292fc01a6a1d35d6cc8b681971
    stage-packages:
      - libicu70
      - libssl3
