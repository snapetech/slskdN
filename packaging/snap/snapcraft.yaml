name: slskdn
base: core22
version: '2026051718-slskdn.261'
summary: slskdN, an unofficial batteries-included fork of slskd
description: |
  slskdN is an unofficial fork of slskd with batteries-included Soulseek features:
  SongID, Discovery Graph, multi-source downloads, DHT mesh networking,
  auto-replace, wishlist, and security hardening.
grade: stable
confinement: strict
architectures:
  - amd64

apps:
  slskdn:
    command: slskd
    daemon: simple
    plugs: [network, network-bind, home, removable-media]
    environment:
      DOTNET_BUNDLE_EXTRACT_BASE_DIR: $SNAP_USER_COMMON/.net

parts:
  slskdn:
    plugin: dump
    source: https://github.com/snapetech/slskdn/releases/download/2026051718-slskdn.261/slskdn-main-linux-glibc-x64.zip
    source-checksum: sha256/be606e8b64b283fe4223dd16260891fa24788fa0db6b7f6648ace249118a1dd6
    stage-packages:
      - libicu70
      - libssl3
