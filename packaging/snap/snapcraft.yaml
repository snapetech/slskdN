name: slskdn
base: core22
version: '2026100521-slskdn.345'
summary: slskdN, an unofficial batteries-included fork of slskd
description: |
  slskdN is an unofficial fork of slskd with batteries-included Soulseek features:
  SongID, Discovery Graph, multi-source downloads, DHT mesh networking,
  auto-replace, wishlist, and security hardening.
grade: stable
confinement: strict
architectures:
  - amd64

apps:
  slskdn:
    command: slskd
    daemon: simple
    plugs: [network, network-bind, home, removable-media]
    environment:
      DOTNET_BUNDLE_EXTRACT_BASE_DIR: $SNAP_USER_COMMON/.net

parts:
  slskdn:
    plugin: dump
    source: https://github.com/snapetech/slskdn/releases/download/2026100521-slskdn.345/slskdn-main-linux-glibc-x64.zip
    source-checksum: sha256/abd1055c034b514754cd1dc4d722d1152d76f9aa5d5ad63d3273c69df262496d
    stage-packages:
      - libicu70
      - libssl3
