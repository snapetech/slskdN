name: slskdn
base: core22
version: '2026051400-slskdn.251'
summary: slskdN, an unofficial batteries-included fork of slskd
description: |
  slskdN is an unofficial fork of slskd with batteries-included Soulseek features:
  SongID, Discovery Graph, multi-source downloads, DHT mesh networking,
  auto-replace, wishlist, and security hardening.
grade: stable
confinement: strict
architectures:
  - amd64

apps:
  slskdn:
    command: slskd
    daemon: simple
    plugs: [network, network-bind, home, removable-media]
    environment:
      DOTNET_BUNDLE_EXTRACT_BASE_DIR: $SNAP_USER_COMMON/.net

parts:
  slskdn:
    plugin: dump
    source: https://github.com/snapetech/slskdn/releases/download/2026051400-slskdn.251/slskdn-main-linux-glibc-x64.zip
    source-checksum: sha256/78345fc23e0d4d0a0f1c9efe53e20e4ce83f1b1fdcfd12d6c66fbb49b2918129
    stage-packages:
      - libicu70
      - libssl3
