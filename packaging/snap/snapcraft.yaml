name: slskdn
base: core22
version: '2026051509-slskdn.256'
summary: slskdN, an unofficial batteries-included fork of slskd
description: |
  slskdN is an unofficial fork of slskd with batteries-included Soulseek features:
  SongID, Discovery Graph, multi-source downloads, DHT mesh networking,
  auto-replace, wishlist, and security hardening.
grade: stable
confinement: strict
architectures:
  - amd64

apps:
  slskdn:
    command: slskd
    daemon: simple
    plugs: [network, network-bind, home, removable-media]
    environment:
      DOTNET_BUNDLE_EXTRACT_BASE_DIR: $SNAP_USER_COMMON/.net

parts:
  slskdn:
    plugin: dump
    source: https://github.com/snapetech/slskdn/releases/download/2026051509-slskdn.256/slskdn-main-linux-glibc-x64.zip
    source-checksum: sha256/2d570e006b4426c8ea17caa7e73870a1be7f5d9e2fa425d32598203a4fe72c3b
    stage-packages:
      - libicu70
      - libssl3
