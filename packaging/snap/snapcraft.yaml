name: slskdn
base: core22
version: '2026080512-slskdn.303'
summary: slskdN, an unofficial batteries-included fork of slskd
description: |
  slskdN is an unofficial fork of slskd with batteries-included Soulseek features:
  SongID, Discovery Graph, multi-source downloads, DHT mesh networking,
  auto-replace, wishlist, and security hardening.
grade: stable
confinement: strict
architectures:
  - amd64

apps:
  slskdn:
    command: slskd
    daemon: simple
    plugs: [network, network-bind, home, removable-media]
    environment:
      DOTNET_BUNDLE_EXTRACT_BASE_DIR: $SNAP_USER_COMMON/.net

parts:
  slskdn:
    plugin: dump
    source: https://github.com/snapetech/slskdn/releases/download/2026080512-slskdn.303/slskdn-main-linux-glibc-x64.zip
    source-checksum: sha256/d1f1d8e0eb0720b13b9559c803e2e3e4615be5a201ba7450b2847046237d1994
    stage-packages:
      - libicu70
      - libssl3
