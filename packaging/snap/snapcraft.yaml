name: slskdn
base: core22
version: '2026090620-slskdn.321'
summary: slskdN, an unofficial batteries-included fork of slskd
description: |
  slskdN is an unofficial fork of slskd with batteries-included Soulseek features:
  SongID, Discovery Graph, multi-source downloads, DHT mesh networking,
  auto-replace, wishlist, and security hardening.
grade: stable
confinement: strict
architectures:
  - amd64

apps:
  slskdn:
    command: slskd
    daemon: simple
    plugs: [network, network-bind, home, removable-media]
    environment:
      DOTNET_BUNDLE_EXTRACT_BASE_DIR: $SNAP_USER_COMMON/.net

parts:
  slskdn:
    plugin: dump
    source: https://github.com/snapetech/slskdn/releases/download/2026090620-slskdn.321/slskdn-main-linux-glibc-x64.zip
    source-checksum: sha256/0c7fb4e54bfbfef4cebee98ec7eb653e092039f35eb373e90dc1f8d2f6682305
    stage-packages:
      - libicu70
      - libssl3
