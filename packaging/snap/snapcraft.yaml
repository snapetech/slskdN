name: slskdn
base: core22
version: '2026072418-slskdn.290'
summary: slskdN, an unofficial batteries-included fork of slskd
description: |
  slskdN is an unofficial fork of slskd with batteries-included Soulseek features:
  SongID, Discovery Graph, multi-source downloads, DHT mesh networking,
  auto-replace, wishlist, and security hardening.
grade: stable
confinement: strict
architectures:
  - amd64

apps:
  slskdn:
    command: slskd
    daemon: simple
    plugs: [network, network-bind, home, removable-media]
    environment:
      DOTNET_BUNDLE_EXTRACT_BASE_DIR: $SNAP_USER_COMMON/.net

parts:
  slskdn:
    plugin: dump
    source: https://github.com/snapetech/slskdn/releases/download/2026072418-slskdn.290/slskdn-main-linux-glibc-x64.zip
    source-checksum: sha256/f855522bbb0b9111f1154bbacba58aa45def44779f3476ae412720f7aa5f698b
    stage-packages:
      - libicu70
      - libssl3
