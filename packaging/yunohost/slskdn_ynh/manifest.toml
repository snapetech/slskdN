#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "slskdn"
name = "slskdN"
description.en = "Self-hosted Soulseek client and server with a web interface."
version = "2026.09.25.17.325~ynh1"
maintainers = ["snapetech"]

[upstream]
license = "AGPL-3.0-or-later"
code = "https://github.com/snapetech/slskdN"
admindoc = "https://github.com/snapetech/slskdN/blob/main/docs/config.md"
userdoc = "https://github.com/snapetech/slskdN/blob/main/docs/getting-started.md"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = true
ldap = false
sso = false
    disk = "500M"
ram.build = "50M"
ram.runtime = "512M"

[antifeatures]
non-free-network.en = "Soulseek is a third-party network and requires a Soulseek account."

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/slskdn"

    [install.init_main_permission]
    type = "group"
    default = "all_users"

[resources]
    [resources.sources.main]
    in_subdir = false
    amd64.url = "https://github.com/snapetech/slskdN/releases/download/2026092517-slskdn.325/slskdn-main-linux-glibc-x64.zip"
    amd64.sha256 = "31c929d2755beb6c058454e65b8d08b1c080d6bfc713c5a973e7a943236740a7"
    arm64.url = "https://github.com/snapetech/slskdN/releases/download/2026092517-slskdn.325/slskdn-main-linux-glibc-arm64.zip"
    arm64.sha256 = "9deb432ece4c4ac126b275447031dfac62fc6d1348ae86d167ba621a5e6e29f0"
    autoupdate.strategy = "latest_github_release"
    autoupdate.version_regex = "^(\\d{4})(\\d{2})(\\d{2})(\\d+)-slskdn\\.(\\d+)$"
    autoupdate.asset.amd64 = "^slskdn-main-linux-glibc-x64\\.zip$"
    autoupdate.asset.arm64 = "^slskdn-main-linux-glibc-arm64\\.zip$"

    [resources.system_user]

    [resources.install_dir]
    dir = "/opt/__APP__"

    [resources.data_dir]
    subdirs = ["downloads", "incomplete"]

    [resources.permissions]
    main.url = "/"
    main.auth_header = false

    [resources.ports]
    main.default = 5030
    soulseek.default = 50300
    soulseek.exposed = "Both"

    [resources.apt]
    packages = [
        "libicu70|libicu72|libicu74|libicu76",
        "liblttng-ust1|liblttng-ust1t64",
        "patchelf",
    ]
