{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "slskdn.fullname" . }}
  labels:
    {{- include "slskdn.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "slskdn.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egress.enabled }}
    - Egress
    {{- end }}
  ingress:
    {{- if .Values.networkPolicy.ingress.web.enabled }}
    - ports:
        - protocol: TCP
          port: {{ .Values.service.main.port }}
        {{- if .Values.service.https.enabled }}
        - protocol: TCP
          port: {{ .Values.service.https.port }}
        {{- end }}
      {{- with .Values.networkPolicy.ingress.web.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
    {{- if .Values.networkPolicy.ingress.soulseek.enabled }}
    - ports:
        - protocol: TCP
          port: {{ .Values.env.SLSKD_SLSK_LISTEN_PORT | int }}
      {{- with .Values.networkPolicy.ingress.soulseek.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
  {{- if .Values.networkPolicy.egress.enabled }}
  egress:
    {{- if .Values.networkPolicy.egress.to }}
    - to:
        {{- toYaml .Values.networkPolicy.egress.to | nindent 8 }}
    {{- else }}
    []
    {{- end }}
  {{- end }}
{{- end }}
